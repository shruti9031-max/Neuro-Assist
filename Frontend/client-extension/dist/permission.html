<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Permission Required - Neuro-Assist</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      max-width: 480px;
      width: 90%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
    }

    .mic-icon {
      font-size: 36px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 12px;
      background: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .status-msg {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #f87171;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <span class="mic-icon">🎙️</span>
    </div>
    <h1 id="permTitle">Microphone Access Required</h1>
    <p id="permDesc">
      To enable Live Voice Navigation, Neuro-Assist needs microphone permission.
      Please click the button below and select <strong>Allow</strong> when prompted by your browser.
    </p>
    <button class="btn" id="btnRequest">Grant Permission</button>
    <div class="status-msg" id="statusMsg"></div>
    <button class="btn" id="btnSimulate" style="margin-top: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: none; display: none;">Use Text Simulator Mode</button>
  </div>
  <script src="./permission.js"></script>
</body>
</html>
